# ====================================================================
# 营销规则引擎 - 一键容器化编排
# 包含：MySQL 8 + 后端 Spring Boot + 前端 Vue3/Nginx
# 启动：docker compose up -d --build
# 停止：docker compose down            （保留数据卷）
# 清空数据：docker compose down -v
# ====================================================================
services:
  mysql:
    image: mysql:8.0
    container_name: rule-engine-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tiger}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rule_engine}
      TZ: Asia/Shanghai
    # 字符集统一 utf8mb4，避免中文乱码
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 等待 MySQL 完全就绪后再启动后端（后端启动会自动建表/初始化数据）
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-tiger}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  rule-engine-web:
    build:
      context: .
      dockerfile: rule-engine-web/Dockerfile
    image: marketing-rule-engine-web:1.0.0
    container_name: rule-engine-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-rule_engine}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tiger}
      TZ: Asia/Shanghai
      # 如需调整 JVM 堆内存：JAVA_OPTS=-Xms512m -Xmx1024m
      JAVA_OPTS: "${JAVA_OPTS:-}"
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      # 持久化上传的函数 Jar（对应 application.yml 的 function-jar-dir）
      - ./data/functions:/app/data/functions

  rule-engine-admin-ui:
    build:
      context: rule-engine-admin-ui
      dockerfile: Dockerfile
    image: marketing-rule-engine-ui:1.0.0
    container_name: rule-engine-admin-ui
    restart: unless-stopped
    depends_on:
      - rule-engine-web
    ports:
      - "${UI_PORT:-80}:80"

volumes:
  mysql_data:
    driver: local
